<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>신수학 수학일기장</title>
<style>
  :root {
    --bg:#faf7f2; --card:#ffffff; --ink:#2b2620; --sub:#8a8074;
    --accent:#b5541c; --accent-soft:#f6e3d3; --line:#e8e0d4; --ok:#2e7d32;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:'Segoe UI','Malgun Gothic',sans-serif; background:var(--bg); color:var(--ink); }
  .wrap { max-width:640px; margin:0 auto; padding:20px 16px 60px; }
  header { text-align:center; padding:18px 0 6px; }
  header h1 { font-size:1.45rem; letter-spacing:-0.5px; }
  header p { color:var(--sub); font-size:0.85rem; margin-top:4px; }

  .roomcard { background:var(--card); border:1px solid var(--line); border-radius:14px;
              padding:14px 16px; margin:16px 0; }
  .roomhead { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:8px; }
  .roomhead b { font-size:1.0rem; }
  .roomhead small { color:var(--sub); }
  .roomsvg { width:100%; border-radius:10px; display:block; }
  .nextline { text-align:center; color:var(--sub); font-size:0.85rem; margin-top:8px; }
  .chips { display:grid; grid-template-columns:repeat(4,1fr); gap:6px; margin-top:10px; }
  .chip { font-size:0.72rem; text-align:center; border-radius:8px; padding:5px 2px;
          background:#f0ede6; color:#b3ab9e; }
  .chip.on { background:var(--accent-soft); color:#712B13; font-weight:600; }

  @keyframes blink{0%,90%,100%{transform:scaleY(1)}94%{transform:scaleY(.06)}}
  @keyframes sway{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(9deg)}}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
  .eye{animation:blink 3.8s infinite;transform-box:fill-box;transform-origin:center}
  .tail{animation:sway 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:15% 85%}
  .bobber{animation:bob 3.2s ease-in-out infinite}
  @keyframes heartpop{0%{opacity:0;transform:translateY(6px) scale(.6)}30%{opacity:1;transform:translateY(0) scale(1.1)}100%{opacity:0;transform:translateY(-16px) scale(1)}}
  .heart{animation:heartpop 1.4s ease-out forwards;transform-box:fill-box;transform-origin:center}
  #giftfx{position:absolute;inset:0;display:none;align-items:center;justify-content:center;
          background:rgba(43,38,32,.28);border-radius:10px;z-index:5}
  .gwrap{text-align:center}
  .gbox{font-size:3.2rem;animation:giftshake .9s ease}
  .gname{margin-top:6px;background:#fff;border-radius:999px;padding:6px 16px;font-weight:700;
         color:#712B13;box-shadow:0 4px 14px rgba(0,0,0,.18);animation:gnamepop .5s .7s both}
  @keyframes giftshake{0%{transform:scale(.2) rotate(0)}40%{transform:scale(1.15) rotate(-8deg)}
    55%{transform:rotate(8deg)}70%{transform:rotate(-6deg)}85%{transform:rotate(4deg)}100%{transform:scale(1) rotate(0)}}
  @keyframes gnamepop{0%{opacity:0;transform:translateY(10px) scale(.7)}100%{opacity:1;transform:translateY(0) scale(1)}}
  @keyframes itempop{0%{transform:scale(.2)}60%{transform:scale(1.35)}100%{transform:scale(1)}}
  .newitem{animation:itempop .7s ease .3s both;transform-box:fill-box;transform-origin:center}
  @keyframes twinkle{0%,100%{opacity:.2}50%{opacity:1}}
  .tw{animation:twinkle 1.6s infinite}
  .tw2{animation:twinkle 1.6s .5s infinite}
  .tw3{animation:twinkle 1.6s 1s infinite}
  @keyframes catjump{0%,100%{transform:translateY(0)}30%{transform:translateY(-14px)}55%{transform:translateY(0)}70%{transform:translateY(-6px)}}
  .catjump{animation:catjump .8s ease}
  @keyframes bellswing{0%,100%{transform:rotate(-9deg)}50%{transform:rotate(9deg)}}
  .bellg{animation:bellswing 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:top center}
  @keyframes yarnwig{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}
  .yarn{animation:yarnwig 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center bottom}
  @keyframes notefloat{0%{opacity:0;transform:translateY(4px)}25%{opacity:1}100%{opacity:0;transform:translateY(-24px)}}
  .note1{animation:notefloat 3s ease-out infinite;transform-box:fill-box}
  .note2{animation:notefloat 3s 1.5s ease-out infinite;transform-box:fill-box}
  @keyframes sunbreathe{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
  .sun{animation:sunbreathe 4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}

  .ep { background:var(--card); border:1px solid var(--line); border-radius:14px;
        margin-bottom:14px; overflow:hidden; }
  .ep-head { display:flex; justify-content:space-between; align-items:center;
             padding:14px 16px; cursor:pointer; }
  .ep-head .t b { font-size:1.0rem; }
  .ep-head .t small { display:block; color:var(--sub); margin-top:2px; }
  .ep-head .done { font-size:1.3rem; }
  .ep-body { display:none; padding:0 16px 16px; }
  .ep.open .ep-body { display:block; }
  .player { position:relative; width:100%; padding-top:56.25%; border-radius:10px; overflow:hidden; background:#000; }
  .player iframe { position:absolute; inset:0; width:100%; height:100%; border:0; }

  .pwbox { margin-top:14px; background:var(--accent-soft); border-radius:10px; padding:14px; }
  .pwbox label { font-size:0.9rem; font-weight:600; }
  .pwrow { display:flex; gap:8px; margin-top:8px; }
  .pwrow input { flex:1; border:1px solid var(--line); border-radius:8px; padding:10px 12px; font-size:1rem; }
  .pwrow button { background:var(--accent); color:#fff; border:0; border-radius:8px;
                  padding:10px 16px; font-size:0.95rem; cursor:pointer; }
  .pwmsg { margin-top:8px; font-size:0.9rem; min-height:1.2em; }
  .pwmsg.ok { color:var(--ok); font-weight:700; }
  .pwmsg.no { color:#c62828; }
  .pwnote { margin-top:12px; color:var(--sub); font-size:0.85rem; }

  footer { text-align:center; margin-top:26px; }
  footer a { color:var(--sub); font-size:0.85rem; text-decoration:none; }
</style>
</head>

<script>
// ── 열람 기록 비콘 — 리더(index.html)와 동일한 구글 폼 재사용 ──
const LOG = {
  action: "https://docs.google.com/forms/d/e/1FAIpQLSf4uKawAYL5SKV4A2yGv8ok_2VGIs-4opvnh6CpeljkY35LeA/formResponse",
  코드: "entry.1580342508", 내용: "entry.1507722106"
};
const SID = new URLSearchParams(location.search).get('s') || '';
// 원장 전용 코드 — 열람 기록을 남기지 않고(학생 통계 오염 방지) 미리보기 도구를 띄운다.
const ADMINS = ['wonjang'];
const IS_ADMIN = ADMINS.includes(SID);
const _logged = new Set();
function logView(label) {
  if (!SID || IS_ADMIN || _logged.has(label)) return;
  _logged.add(label);
  const body = new URLSearchParams();
  body.append(LOG.코드, SID);
  body.append(LOG.내용, label);
  fetch(LOG.action, { method:'POST', mode:'no-cors', body }).catch(()=>{});
}
if (SID) {
  logView('(일기장 열기)');
  document.getElementById('readerLink').href = 'index.html?s=' + encodeURIComponent(SID);
}

// ── 완료 기록 (이 기기 localStorage) ──
const KEY = 'diary_done_' + (SID || 'anon');
function loadDone() { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch { return {}; } }
function saveDone(d) { localStorage.setItem(KEY, JSON.stringify(d)); }

// ── 꾸미기 아이템: [완료 일수, 이름, SVG id] ──
const ITEMS = [
  [1,  '우유 그릇',   'item1'],
  [2,  '푹신 방석',   'item2'],
  [3,  '털실 뭉치',   'item3'],
  [5,  '생선 간식',   'item5'],
  [7,  '방울 목걸이', 'acc7'],
  [9,  '화분',        'item9'],
  [12, '추억 액자',   'item12'],
  [15, '리본',        'acc14'],
  [18, '꽃무늬 러그', 'item18'],
  [21, '목도리',      'acc21'],
  [25, '오르골',      'item25'],
  [30, '황금 왕관',   'acc30'],
];

let _preview = null;   // 원장 미리보기 일수 (null이면 실제 기록)
let _shownN = null;    // 직전 렌더의 완료 일수 — 증가분만 팝 연출

function _pop(g) { if (!g) return; g.classList.remove('newitem'); void g.getBBox(); g.classList.add('newitem'); }
function catJump() { const j = document.getElementById('jumper'); j.classList.remove('catjump'); void j.getBBox(); j.classList.add('catjump'); }

function renderRoom() {
  const done = loadDone();
  const days = Object.keys(done).map(Number);
  const n = (_preview === null) ? days.length : _preview;
  // 연속 일수: 완료한 에피소드의 date가 이어진 길이(주말 하루 건너뜀 허용)
  let streak = 0;
  const dates = days.map(d => (DIARY.find(e=>e.day===d)||{}).date).filter(Boolean).sort();
  for (let i = dates.length - 1; i >= 0; i--) {
    if (i === dates.length - 1) { streak = 1; continue; }
    if ((new Date(dates[i+1]) - new Date(dates[i])) / 86400000 <= 2) streak++; else break;
  }
  document.getElementById('streakLine').textContent = (_preview !== null)
    ? `미리보기 ${n}일`
    : `완료 ${n}일${streak >= 2 ? ` · 🔥${streak}일 연속` : ''}`;
  const prev = _shownN;
  for (const [d, , id] of ITEMS)
    document.getElementById(id).style.display = (n >= d) ? '' : 'none';
  // 새로 생긴 것들 팝 + 고양이 점프 (첫 렌더는 조용히)
  if (prev !== null && n > prev) {
    ITEMS.filter(([d]) => d > prev && d <= n)
         .forEach(([, , id]) => _pop(document.getElementById(id)));
    [[7,'fur-tail'],[12,'fur-back'],[21,'fur-chest'],[30,'aura']]
      .filter(([d]) => d > prev && d <= n)
      .forEach(([, id]) => _pop(document.getElementById(id)));
    catJump();
  }
  _shownN = n;
  // 고양이 성장 단계 — 크기 대신 생김새가 변한다
  const spark = n >= 5;
  ['hl1','hl2'].forEach(id => document.getElementById(id).setAttribute('r', spark ? '2.7' : '1.9'));
  document.getElementById('mouth').setAttribute('stroke-width', spark ? '2.8' : '2.2');
  ['bl1','bl2'].forEach(id => document.getElementById(id).setAttribute('opacity', spark ? '0.95' : '0.75'));
  document.getElementById('fur-tail').style.display  = n >= 7  ? '' : 'none';
  document.getElementById('fur-back').style.display  = n >= 12 ? '' : 'none';
  document.getElementById('fur-chest').style.display = n >= 21 ? '' : 'none';
  document.getElementById('aura').style.display      = n >= 30 ? '' : 'none';
  const next = ITEMS.find(i => i[0] > n);
  document.getElementById('nextLine').textContent = next
    ? `다음 선물: ${next[1]} (${next[0] - n}일 남음)`
    : '모든 선물 도착! 방이 가득 찼어요';
  document.getElementById('chips').innerHTML = ITEMS.map(([d, name]) =>
    `<div class="chip${n >= d ? ' on' : ''}">${name}<br>${d}일</div>`).join('');
}

function popHearts() {
  const h = document.getElementById('hearts');
  h.style.display = 'none';
  void h.getBoundingClientRect();
  h.style.display = '';
  setTimeout(() => { h.style.display = 'none'; }, 1700);
}

function markDone(day) {
  const d = loadDone();
  if (d[day]) return false;
  const nBefore = Object.keys(d).length;
  d[day] = true; saveDone(d);
  renderRoom(); popHearts();
  const won = ITEMS.filter(it => it[0] > nBefore && it[0] <= nBefore + 1);
  if (won.length) giftFx(won.map(it => it[1]));
  return true;
}

function giftFx(names, i = 0) {
  const fx = document.getElementById('giftfx');
  if (i >= names.length) { fx.style.display = 'none'; fx.innerHTML = ''; return; }
  fx.style.display = 'flex';
  fx.innerHTML = `<div class="gwrap"><div class="gbox">🎁</div><div class="gname">✨ ${names[i]} 획득!</div></div>`;
  setTimeout(() => giftFx(names, i + 1), 2000);
}

// ── 에피소드 렌더 ──
async function sha256(s) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
  return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2,'0')).join('');
}
function render() {
  const done = loadDone();
  const list = document.getElementById('list');
  list.innerHTML = '';
  [...DIARY].sort((a,b)=>b.day-a.day).forEach(ep => {
    const el = document.createElement('div');
    el.className = 'ep';
    el.innerHTML = `
      <div class="ep-head">
        <div class="t"><b>${ep.day}일차 · ${ep.topic}</b><small>${ep.date}</small></div>
        <div class="done">${done[ep.day] ? '✅' : '▶️'}</div>
      </div>
      <div class="ep-body">
        <div class="player" data-yt="${ep.youtube}"></div>
        ${ep.pw ? `
        <div class="pwbox">
          <label>🔑 오늘의 암호</label>
          <div class="pwrow">
            <input type="text" placeholder="영상 끝에서 알려준 암호" autocomplete="off">
            <button>확인</button>
          </div>
          <div class="pwmsg"></div>
        </div>` : `
        <div class="pwnote">이 회차는 암호가 없어요 — 영상을 열면 완료로 기록돼요.</div>`}
      </div>`;
    const head = el.querySelector('.ep-head');
    head.addEventListener('click', () => {
      const opening = !el.classList.contains('open');
      document.querySelectorAll('.ep.open').forEach(o => o.classList.remove('open'));
      if (opening) {
        el.classList.add('open');
        const p = el.querySelector('.player');
        if (!p.querySelector('iframe')) {
          p.innerHTML = `<iframe src="https://www.youtube.com/embed/${p.dataset.yt}?rel=0" allow="autoplay; encrypted-media" allowfullscreen></iframe>`;
        }
        logView(`일기장${ep.day}일차 열람`);
        if (!ep.pw && markDone(ep.day)) el.querySelector('.done').textContent = '✅';
      }
    });
    if (ep.pw) {
      const input = el.querySelector('.pwrow input');
      const btn = el.querySelector('.pwrow button');
      const msg = el.querySelector('.pwmsg');
      const submit = async () => {
        const v = input.value.trim().toLowerCase().replace(/\s+/g,'');
        if (!v) return;
        if (await sha256(v) === ep.pw) {
          msg.textContent = '⭕ 정답! 냥이룸에 선물이 도착했어요';
          msg.className = 'pwmsg ok';
          logView(`일기장${ep.day}일차 암호⭕`);
          markDone(ep.day);
          el.querySelector('.done').textContent = '✅';
        } else {
          msg.textContent = '❌ 다시 한번 — 영상 마지막을 확인해봐';
          msg.className = 'pwmsg no';
          logView(`일기장${ep.day}일차 암호❌:${v.slice(0,20)}`);
        }
      };
      btn.addEventListener('click', submit);
      input.addEventListener('keydown', e => { if (e.key === 'Enter') submit(); });
    }
    list.appendChild(el);
  });
}
render();
renderRoom();

if (IS_ADMIN) {
  const box = document.getElementById('adminbox');
  const sl = document.getElementById('pvslider');
  const lb = document.getElementById('pvlabel');
  box.style.display = '';
  sl.value = Object.keys(loadDone()).length;
  lb.textContent = '실제 기록';
  sl.addEventListener('input', () => {
    _preview = +sl.value;
    lb.textContent = `${_preview}일 시점`;
    renderRoom();
  });
}
