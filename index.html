<style>
  :root { --ink:#1a1a1a; --accent:#2e7d32; --line:#e0e0e0; }
  * { box-sizing:border-box; }
  body { font-family:'Malgun Gothic',sans-serif; color:var(--ink); max-width:720px; margin:0 auto; padding:16px; background:#fafafa; }
  h1 { font-size:1.15rem; margin:4px 0 2px; }
  .sub { color:#666; font-size:.85rem; margin-bottom:16px; }
  .card { background:#fff; border:1px solid var(--line); border-radius:12px; padding:20px 24px; box-shadow:0 1px 4px rgba(0,0,0,.06); }
  .type-card { display:flex; align-items:center; gap:12px; padding:14px 18px; margin-bottom:10px; cursor:pointer; transition:border-color .15s; }
  .type-card:hover { border-color:var(--accent); }
  .num { background:var(--accent); color:#fff; border-radius:8px; min-width:44px; text-align:center; padding:6px 0; font-weight:bold; font-size:.85rem; }
  .type-card .name { flex:1 1 auto; min-width:0; font-weight:bold; word-break:keep-all; }
  .type-card .info { color:#888; font-size:.8rem; white-space:nowrap; flex:0 0 auto; }
  /* 좁은 화면(학생 폰) 대응 — 2026-07-29.
     .info 가 nowrap 이라 폭을 먼저 가져가면 .name 이 한 글자 폭(16px)까지 짜부라져
     제목이 세로로 한 자씩 끊겼다. 좁아지면 배지/제목 줄과 정보 줄을 분리한다. */
  @media (max-width: 560px) {
    .type-card { flex-wrap:wrap; row-gap:6px; }
    .type-card .name { flex:1 1 auto; }
    .type-card .info { flex:1 0 100%; padding-left:56px; }
  }
  .meta { display:flex; gap:8px; align-items:center; margin-bottom:12px; flex-wrap:wrap; }
  .badge { background:var(--accent); color:#fff; border-radius:6px; padding:2px 10px; font-size:.8rem; font-weight:bold; }
  .unit { color:#666; font-size:.85rem; }
  .problem { font-size:1.05rem; line-height:1.8; margin:8px 0 16px; }
  .choices { display:flex; gap:18px; flex-wrap:wrap; margin-bottom:16px; }
  iframe.player { width:100%; aspect-ratio:16/9; border:0; border-radius:8px; }
  .speed-row { display:flex; align-items:center; gap:6px; margin:8px 0 4px; flex-wrap:wrap; }
  .speed-label { color:#888; font-size:.8rem; margin-right:2px; }
  .speed-btn { border:1px solid var(--line); background:#fff; border-radius:6px; padding:4px 11px; font-size:.82rem; cursor:pointer; color:#444; }
  .speed-btn:hover { border-color:var(--accent); }
  .speed-btn.active { background:var(--accent); color:#fff; border-color:var(--accent); font-weight:bold; }
  details { border:1px solid var(--line); border-radius:8px; margin-top:10px; overflow:hidden; }
  summary { cursor:pointer; padding:10px 14px; font-weight:bold; background:#f5f5f5; user-select:none; }
  details[open] summary { border-bottom:1px solid var(--line); }
  .slot-body { padding:12px 16px; line-height:1.8; }
  .slot-empty { color:#aaa; }
  .back { display:inline-block; margin-bottom:12px; color:var(--accent); font-weight:bold; cursor:pointer; text-decoration:none; }
  .note { color:#888; font-size:.8rem; margin-top:14px; line-height:1.6; }
  .course-head { margin:24px 0 10px; padding-left:10px; border-left:4px solid var(--accent);
                 font-weight:bold; font-size:1.02rem; color:#333;
                 display:flex; align-items:center; gap:8px; }
  .course-head:first-of-type { margin-top:14px; }
  .course-count { font-weight:normal; font-size:.78rem; color:#999; }
</style>

      { 유형:"마무리01", 이름:"공간도형의 핵심은 '각'", 문항:"강의 구간", start:2040, end:2090, 쪽:"", 개념:"중학교까지가 길이(피타고라스)였다면 공간도형은 대부분 각을 묻는다. 코사인 값을 구하는 형태가 주력" },
      { 유형:"마무리02", 이름:"다음 시간 예고 — 삼수선의 정리·정사영", 문항:"강의 구간", start:2090, end:2123, 쪽:"", 개념:"이 단원에서 가장 중요한 두 가지는 정사영과 삼수선의 정리. 다음 시간에 이어서" }
    ]
  }
];

// ── 렌더링 ──
const app = document.getElementById('app');
const mmss = s => `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;

// ── 배속 제어: YouTube IFrame(enablejsapi=1) 에 postMessage 명령 전송 ──
function setSpeed(rate, btn){
  const f = document.getElementById('ytplayer');
  if (f && f.contentWindow) f.contentWindow.postMessage(
    JSON.stringify({event:'command', func:'setPlaybackRate', args:[rate]}), '*');
  document.querySelectorAll('.speed-btn').forEach(b=>b.classList.remove('active'));
  if (btn) btn.classList.add('active');
}

// ── 열람 기록 비콘 (구글 폼) — 학생별 ?s=코드 로 접속하면 열람이 시트에 기록됨 ──
const LOG = {
  action: "https://docs.google.com/forms/d/e/1FAIpQLSf4uKawAYL5SKV4A2yGv8ok_2VGIs-4opvnh6CpeljkY35LeA/formResponse",
  코드: "entry.1580342508", 내용: "entry.1507722106"
};
const SID = new URLSearchParams(location.search).get('s') || '';

// ── 과정별 자동 노출 ── 학생 코드 → 수강 과정(노션 명단 기준). 각 단원의 course 와 일치하는 것만 표시.
//   · 코드 없음/미등록 = 전체 노출(기존과 동일)   · extra:[단원key] = 예외로 추가 노출(하이브리드)
const STUDENTS = {
  // 🔴 2026-08-25: 학생 실명 제거. 이 파일은 **공개 저장소**로 나가는데 코드↔실명 매핑이
  //    그대로 실려 있었다(재원생 17명). 리더는 courses/extra 만 쓰고 name 은 쓰지 않는다
  //    (591~595행) → 지워도 기능 영향 0. 명단이 필요하면 노션·master CSV(비공개)를 볼 것.
  // 고1 · 공통수학2
  pj7q: { courses:["공통수학2"] },
  ks3m: { courses:["공통수학2"] },
  id5v: { courses:["공통수학2"] },
  hd8x: {   courses:["공통수학2"] },
  jhj7: { courses:["공통수학2"] },
  csh9: { courses:["공통수학2"] },
  kmj4: { courses:["공통수학2"] },
  bsj2: { courses:["공통수학2"] },
  shs5: { courses:["공통수학2"] },
  lhy6: { courses:["공통수학2"] },
  jhr8: { courses:["공통수학2"] },
  // 고2 · 미적분Ⅰ
  is6h: { courses:["미적분Ⅰ"] },
  ig7u: { courses:["미적분Ⅰ"] },
  mms2: { courses:["미적분Ⅰ"] },
  bsw3: { courses:["미적분Ⅰ"] },
  syj4: { courses:["미적분Ⅰ"] },
  jyy5: { courses:["미적분Ⅰ"] },
};
const _me = STUDENTS[SID] || null;
function unitVisible(u) {
  if (!_me) return true;                                  // 무코드/미등록 → 전체
  if ((_me.extra || []).includes(u.key)) return true;     // 예외 추가
  return (_me.courses || []).includes(u.course);          // 내 과정과 일치
}

const IS_ADMIN = ['wonjang'].includes(SID);   // 원장 전용 — 열람 기록 남기지 않음
const _logged = new Set();
function logView(label) {
  if (!SID || IS_ADMIN || _logged.has(label)) return;   // 코드 없거나 원장이면 기록 안 함 / 세션 중복 방지
  _logged.add(label);
  const body = new URLSearchParams();
  body.append(LOG.코드, SID);
  body.append(LOG.내용, label);
  fetch(LOG.action, { method:'POST', mode:'no-cors', body }).catch(()=>{});
}
if (SID) logView('(리더 열기)');

function slot(title, html) {
  const body = html
    ? `<div class="slot-body">${html}</div>`
    : `<div class="slot-body slot-empty">아직 준비 중</div>`;
  return `<details><summary>${title}</summary>${body}</details>`;
}

// 강의가 늘면서 한 줄로 늘어놓으면 찾기 어려워졌다(2026-07-29, 3강 → 10강).
// 과목(course)별로 묶고 그 안에서 녹화일 순으로 보여준다. course 는 unitVisible 이
// 이미 쓰는 필드라 새 축을 만들지 않는다.
const COURSE_ORDER = ['공통수학2', '미적분Ⅰ', '기하'];

function renderHome() {
  const vis = UNITS.map((u, U) => ({ u, U })).filter(x => unitVisible(x.u));
  const groups = {};
  vis.forEach(x => { const c = x.u.course || '기타'; (groups[c] = groups[c] || []).push(x); });
  const rank = c => { const i = COURSE_ORDER.indexOf(c); return i < 0 ? 99 : i; };
  const body = Object.keys(groups)
    .sort((a, b) => rank(a) - rank(b) || a.localeCompare(b))
    .map(c => `
      <div class="course-head">${c}<span class="course-count">${groups[c].length}강</span></div>
      ${groups[c]
        .sort((x, y) => (x.u.video.date || '').localeCompare(y.u.video.date || ''))
        .map(({ u, U }) => `
        <div class="card type-card" onclick="location.hash='#u${U}'">
          <span class="num" style="min-width:0;padding:6px 12px">단원</span>
          <span class="name">${u.title}</span>
          <span class="info">${u.segments.length}개 유형 · ${u.video.date}</span>
        </div>`).join('')}`).join('');
  app.innerHTML = `
    <h1>신수학 대표유형 강의</h1>
    <div class="sub">단원을 누르면 유형별 강의로 이동합니다 · 유형을 누르면 해당 구간만 재생</div>
    <div class="card type-card" onclick="location.href='diary.html'+(SID?'?s='+encodeURIComponent(SID):'')" style="background:#f6e3d3">
      <span class="num" style="min-width:0;padding:6px 12px">📔</span>
      <span class="name">수학일기장 — 매일 한 편, 오늘의 복습</span>
      <span class="info">오늘의 암호를 맞히면 나무가 자라요</span>
    </div>
    ${body || '<div class="card slot-empty" style="text-align:center">배정된 강의가 아직 없습니다.</div>'}
    <div class="note">신수학 재원생 전용 · 문의는 원장님께</div>`;
}

function renderUnitList(U) {
  const u = UNITS[U];
  app.innerHTML = `
    <a class="back" href="#">← 단원 목록</a>
    <h1>${u.title} — 대표유형 강의</h1>
    <div class="sub">${u.video.unit} · ${u.video.date} 녹화 · 유형을 누르면 해당 구간만 재생됩니다</div>
    ${u.segments.map((s, i) => `
      <div class="card type-card" onclick="location.hash='#u${U}q${i}'">
        <span class="num">${s.유형}</span>
        <span class="name">${s.이름}</span>
        <span class="info">${mmss(s.end - s.start)} · ${s.문항}</span>
      </div>`).join('')}
    <div class="note">신수학 재원생 전용 · 문의는 원장님께</div>`;
}

function renderDetail(U, i) {
  const u = UNITS[U], s = u.segments[i], V = u.video;
  logView(`${u.title} · ${s.유형} ${s.이름}`);
  const isConcept = /^유형|개념/.test(s.문항) || s.문항.includes('유형');
  app.innerHTML = `
    <a class="back" href="#u${U}">← ${u.title} 유형 목록</a>
    <div class="card">
      <div class="meta"><span class="badge">${s.유형}</span><span class="unit">${V.unit}</span></div>
      <h1>${s.이름}</h1>
      ${s.문제
        ? `<div class="problem">${s.문제}</div>
           <div class="choices">${(s.선지||[]).map(c => `<span>${c}</span>`).join('')}</div>`
        : `<div class="problem slot-empty">${V.textbook} ${s.쪽}쪽 · ${s.문항}${isConcept?'':'번'} (교재를 펴 놓고 들으세요)</div>`}
      ${V.youtube
        /* enablejsapi=1 은 origin 없이는 유튜브가 재생을 막는다(오류 153 "플레이어 구성 오류",
           2025 정책. 2026-08-28 실측 — 재생 버튼은 뜨는데 눌러도 시작이 안 되는 증상).
           file:// 에서는 origin 이 "null" 이라 붙이면 오히려 죽는다 → http 일 때만. */
        ? `<iframe id="ytplayer" class="player" allowfullscreen
             src="https://www.youtube-nocookie.com/embed/${V.youtube}?start=${s.start}&end=${s.end}&rel=0&enablejsapi=1${location.origin.startsWith('http')?'&origin='+encodeURIComponent(location.origin):''}"></iframe>
           <div class="speed-row"><span class="speed-label">배속</span>
             ${[0.75,1,1.25,1.5,2].map(r=>`<button class="speed-btn${r===1?' active':''}" onclick="setSpeed(${r},this)">${r}x</button>`).join('')}
           </div>`
        : `<div class="problem slot-empty">🎬 강의 영상 업로드 준비 중입니다 (${mmss(s.start)}~${mmss(s.end)} 구간)</div>`}
      ${slot('개념', s.개념)}
      ${slot('유사문제', s.유사문제)}
      ${slot('정답', s.정답)}
      ${slot('풀이', s.풀이)}
    </div>`;
  if (window.renderMathInElement) renderMathInElement(app, {
    delimiters: [{left:'$$', right:'$$', display:true}, {left:'$', right:'$', display:false}]
  });
}

function route() {
  const d = location.hash.match(/^#u(\d+)q(\d+)$/);
  const l = location.hash.match(/^#u(\d+)$/);
  if (d && UNITS[+d[1]] && unitVisible(UNITS[+d[1]]) && UNITS[+d[1]].segments[+d[2]]) renderDetail(+d[1], +d[2]);
  else if (l && UNITS[+l[1]] && unitVisible(UNITS[+l[1]])) renderUnitList(+l[1]);
  else renderHome();
  window.scrollTo(0, 0);
}
window.addEventListener('hashchange', route);
document.addEventListener('DOMContentLoaded', route);
</script>
</body>
</html>
